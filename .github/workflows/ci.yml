name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: bin/test
      - run: bin/test-install
      # Ubuntu 24.04 ships the oldest libmpv the packages accept (0.37).
      - name: Play through the distro libmpv
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d /dev/shm/yt-music-ci.XXXXXX)
          bin/test -- --ignored --exact \
            player::tests::plays_with_the_installed_libmpv \
            player::tests::playback_checks_the_account_version_once_when_needed
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.x"
      - name: Install the reviewed yt-dlp
        run: |
          version=$(grep -oP 'REVIEWED_VERSION = "\K[0-9.]+(?=")' src/ytdlp_account.py)
          python -m pip install --quiet "yt-dlp==$version"
      - name: Test yt-dlp contracts
        env:
          YT_DLP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: >-
          bin/test -- --ignored --exact
          player::tests::quality_selectors_respect_audio_classes_and_video_caps
          player::tests::embedded_extractor_binds_the_selected_account

  # Builds and plays audio on Apple Silicon. Sign-in and video are Linux-only so far.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: bin/test
      - name: Play through Homebrew's libmpv
        run: bin/test -- --ignored --exact player::tests::plays_with_the_installed_libmpv

  # Builds and plays audio on Windows. Sign-in and video are Linux-only so far.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks out CRLF by default, which breaks bin/test.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: bin/test
      - name: Play through mpv's libmpv
        run: bin/test -- --ignored --exact player::tests::plays_with_the_installed_libmpv

  release-test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-build.yml
