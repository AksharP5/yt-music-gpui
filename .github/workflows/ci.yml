name: Ubuntu mirror setup validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the observed EC2 mirror list
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\tpriority:%d\n' \
            'http://us-east-2.ec2.archive.ubuntu.com/ubuntu/' 1 \
            'https://archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 \
            | sudo tee /etc/apt/apt-mirrors.txt
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Verify installation and mirror order
        shell: bash
        run: |
          mirror_list=$(cat /etc/apt/apt-mirrors.txt)
          printf '%s\n' "$mirror_list"
          expected=$(printf '%s\tpriority:%d\n' \
            'http://azure.archive.ubuntu.com/ubuntu/' 1 \
            'http://us-east-2.ec2.archive.ubuntu.com/ubuntu/' 4 \
            'https://archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3)
          test "$mirror_list" = "$expected"
          pkg-config --exists mpv egl wayland-client x11 fontconfig
          dpkg-query -W libmpv-dev libmpv2
