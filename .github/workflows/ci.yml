name: Ubuntu mirror comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Compare downloads on this runner
        shell: bash
        run: |
          awk '/^URIs:/ {print}' /etc/apt/sources.list.d/ubuntu.sources
          object=/ubuntu/dists/noble/main/binary-amd64/Packages.xz
          for mirror in us-east-2.ec2.archive.ubuntu.com azure.archive.ubuntu.com azure.archive.ubuntu.com us-east-2.ec2.archive.ubuntu.com; do
            metrics=$(curl --silent --show-error --fail --max-time 55 --output /dev/null \
              --write-out '%{http_code} %{size_download} %{time_total} %{speed_download}' \
              "http://${mirror}${object}") && result=0 || result=$?
            printf '%s %s %s\n' "$mirror" "$result" "$metrics" | tee -a comparison.tsv
          done
          summary="$GITHUB_STEP_SUMMARY"
          printf '| Mirror | Curl exit | HTTP | Bytes | Seconds | Bytes per second |\n| --- | ---: | ---: | ---: | ---: | ---: |\n' >> "$summary"
          while read -r mirror result code bytes seconds speed; do
            printf '| %s | %s | %s | %s | %s | %s |\n' "$mirror" "$result" "$code" "$bytes" "$seconds" "$speed" >> "$summary"
          done < comparison.tsv
