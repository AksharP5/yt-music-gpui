# TEMPORARY: macOS ground-truth probe for PR #72. Removed before merge.
name: macOS probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: brew install deno
      - name: Install the reviewed yt-dlp
        run: |
          version=$(sed -n 's/^REVIEWED_VERSION = "\(.*\)"/\1/p' src/ytdlp_account.py)
          python3 -m venv "$RUNNER_TEMP/ytdlp"
          "$RUNNER_TEMP/ytdlp/bin/pip" install --quiet "yt-dlp==$version"
          echo "$RUNNER_TEMP/ytdlp/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked
      - name: GPUI text without the app
        continue-on-error: true
        run: |
          mkdir -p examples shots
          cat > examples/hello.rs <<'RS'
          use gpui::{App, AppContext, Bounds, Context, IntoElement, ParentElement, Render, Styled, Window, WindowBounds, WindowOptions, div, px, rgb, size};
          struct Hello;
          impl Render for Hello {
              fn render(&mut self, _: &mut Window, _: &mut Context<Self>) -> impl IntoElement {
                  div().size_full().bg(rgb(0x505050)).text_color(rgb(0xffffff)).text_size(px(32.))
                      .flex().flex_col().gap_4().p_8()
                      .child("Default font: Hello macOS")
                      .child(div().font_family("Helvetica").child("Helvetica: Hello macOS"))
                      .child(div().font_family("Roboto").child("Roboto: Hello macOS"))
              }
          }
          fn main() {
              gpui_platform::application().run(|cx: &mut App| {
                  cx.text_system().add_fonts(vec![std::borrow::Cow::Borrowed(include_bytes!("../assets/fonts/Roboto.ttf").as_slice())]).unwrap();
                  let bounds = Bounds::centered(None, size(px(700.), px(400.)), cx);
                  cx.open_window(WindowOptions { window_bounds: Some(WindowBounds::Windowed(bounds)), ..Default::default() }, |_, cx| cx.new(|_| Hello)).unwrap();
                  cx.activate(true);
              });
          }
          RS
          cargo build --locked --example hello
          target/debug/examples/hello & pid=$!
          sleep 10
          screencapture -x shots/6-gpui-hello.png || true
          kill $pid
          defaults read -g AppleFontSmoothing || echo "AppleFontSmoothing unset"
          defaults -currentHost read -g AppleFontSmoothing || echo "currentHost AppleFontSmoothing unset"
          system_profiler SPDisplaysDataType || true
      - name: The app with font smoothing off
        continue-on-error: true
        run: |
          defaults -currentHost write -g AppleFontSmoothing -int 0
          defaults write -g AppleFontSmoothing -int 0
          target/debug/yt-music-gpui --guest & pid=$!
          sleep 20
          screencapture -x shots/7-smoothing-off.png || true
          kill -TERM $pid
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: macos-shots
          path: shots
