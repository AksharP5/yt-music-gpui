name: Build release artifact

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Release builds start clean: other jobs, including the weekly test of
      # unreviewed yt-dlp releases, share the build cache.
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - name: Check release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo 'Tag must match the Cargo.toml version.' >&2
            exit 1
          fi
          # Only reviewed code ships: the tagged commit must already be on main.
          if [[ "$REF_TYPE" == tag ]] && ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'Release tags must point at a commit on main.' >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      # Each package container runs this against its own libmpv.
      - name: Build the libmpv playback test
        run: |
          test=$(cargo test --release --locked --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .executable != null) | .executable')
          install -D -m755 "$test" player-test/yt-music-gpui-tests
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: player-test
          path: player-test/yt-music-gpui-tests
          if-no-files-found: error
      - name: Package the app and reviewed runtime pins
        run: |
          mkdir -p dist/stage
          install -m755 target/release/yt-music-gpui dist/stage/
          install -m644 packaging/yt-music-gpui.desktop packaging/yt-music-gpui.svg \
            LICENSE* NOTICE assets/fonts/OFL.txt dist/stage/
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          source = ast.parse(Path('src/ytdlp_account.py').read_text())
          pins = {node.targets[0].id: ast.literal_eval(node.value) for node in source.body
                  if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant)}
          Path('dist/stage/runtime-pins.json').write_text(json.dumps({
              'ytdlp_version': pins['REVIEWED_VERSION'], 'ytdlp_sha256': pins['REVIEWED_SHA256'],
              'deno_version': pins['DENO_VERSION'], 'deno_sha256': pins['DENO_SHA256'],
              'deno_size': pins['DENO_SIZE'],
          }) + '\n')
          PY
          name="yt-music-gpui-$VERSION-x86_64-linux.tar.gz"
          tar -czf "dist/$name" -C dist/stage -- $(find dist/stage -type f -printf '%f\n' | sort)
          (cd dist && sha256sum "$name" > "$name.sha256")
          install -m755 install.sh dist/install.sh
          {
            echo 'Direct dynamic dependencies:'
            readelf -d target/release/yt-music-gpui | grep NEEDED
            echo 'Required glibc symbol versions (highest is the compatibility floor):'
            readelf --dyn-syms --wide target/release/yt-music-gpui | grep -o 'GLIBC_[0-9.]*' | sort -Vu
            echo 'ldd on Ubuntu 24.04:'
            ldd target/release/yt-music-gpui
          } | tee dist/dependencies.txt
      - name: Build .deb and .rpm packages with the pinned yt-dlp and Deno
        env:
          NFPM_VERSION: 2.49.0
          NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7
        run: |
          get() { curl -q --proto '=https' --tlsv1.2 -fsSL "$1" -o "$2"; echo "$3  $2" | sha256sum -c; }
          pin() { jq -r ".$1" dist/stage/runtime-pins.json; }
          mkdir -p dist/helpers dist/licenses tools
          get "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" tools/nfpm.tar.gz "$NFPM_SHA256"
          tar -xzf tools/nfpm.tar.gz -C tools nfpm
          get "https://github.com/yt-dlp/yt-dlp/releases/download/$(pin ytdlp_version)/yt-dlp" dist/helpers/yt-dlp "$(pin ytdlp_sha256)"
          get "https://github.com/denoland/deno/releases/download/v$(pin deno_version)/deno-x86_64-unknown-linux-gnu.zip" tools/deno.zip "$(pin deno_sha256)"
          [ "$(zipinfo -1 tools/deno.zip)" = deno ]
          unzip -q tools/deno.zip deno -d dist/helpers
          chmod 755 dist/helpers/yt-dlp dist/helpers/deno
          cp dist/stage/LICENSE* dist/stage/NOTICE dist/stage/OFL.txt packaging/LICENSE-DENO packaging/LICENSE-V8 packaging/NOTICE-DENO packaging/LICENSE-YT-DLP dist/licenses/
          for packager in deb rpm; do tools/nfpm package --config packaging/nfpm.yaml --packager "$packager" --target dist/; done
          (cd dist && for package in *.deb *.rpm; do sha256sum "$package" > "$package.sha256"; done)

      - name: Measure local guest playback
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test -x dist/helpers/yt-dlp
          runtime=$(mktemp -d /dev/shm/yt-music-playback.XXXXXX)
          XDG_RUNTIME_DIR="$runtime" XDG_DATA_HOME="$RUNNER_TEMP/yt-music-playback-data" PATH="$PWD/dist/helpers:$PATH" \
            player-test/yt-music-gpui-tests --ignored --exact \
              player::tests::measure_local_guest_playback --nocapture | tee "$runtime/samples.log"
          python3 - "$runtime/samples.log" <<'PY'
          import json
          import os
          from pathlib import Path
          import statistics
          import sys

          lines = Path(sys.argv[1]).read_text().splitlines()
          prefix = "playback_samples "
          sample, = (json.loads(line.split(prefix, 1)[1]) for line in lines if prefix in line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("### Local guest playback on Linux", file=summary)
              print("", file=summary)
              print("| Play request to first advancing position | Samples | Median |", file=summary)
              print("| --- | ---: | ---: |", file=summary)
              for label, key in [("First play", "first_position_ms"), ("Warm switch", "warm_switch_ms")]:
                  values = sample[key]
                  print(f"| {label} | {len(values)} | {statistics.median(values):.1f} ms |", file=summary)
              print("", file=summary)
          PY

      - name: Remove package staging files
        run: rm -r dist/stage dist/helpers dist/licenses tools
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Compare stripped binary size with the branch base
        if: github.event_name == 'workflow_dispatch'
        run: |
          base=$(git merge-base HEAD origin/main)
          candidate=$(stat -c %s target/release/yt-music-gpui)
          baseline=$candidate
          if [[ "$base" != "$GITHUB_SHA" ]]; then
            base_tree="$RUNNER_TEMP/yt-music-release-base"
            git worktree add --detach "$base_tree" "$base"
            trap 'git worktree remove "$base_tree"' EXIT
            export CARGO_TARGET_DIR="$PWD/target"
            (cd "$base_tree" && cargo rustc --release --locked --bin yt-music-gpui -- \
              --cfg "ytm_benchmark_revision=\"$base\"")
            baseline=$(stat -c %s target/release/yt-music-gpui)
          fi
          {
            printf '### Linux x86-64 release size\n\n'
            printf '| Stripped binary | Bytes |\n| --- | ---: |\n'
            printf '| Base `%s` | %d |\n' "${base:0:12}" "$baseline"
            printf '| Candidate `%s` | %d |\n' "${GITHUB_SHA:0:12}" "$candidate"
            printf '| Change | %+d |\n\n' "$((candidate - baseline))"
            printf '| Candidate package | Bytes |\n| --- | ---: |\n'
            for package in dist/*.tar.gz dist/*.deb dist/*.rpm; do
              size=$(stat -c %s "$package")
              printf '| `%s` | %d |\n' "${package##*/}" "$size"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu:24.04, fedora:43]
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-x86_64
          path: dist
      - name: Check binary and installer in a different distribution
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" "$DISTRO" sh -ec '
            if command -v apt-get >/dev/null; then
              apt-get update -qq
              apt-get install -y --no-install-recommends ca-certificates curl python3 libmpv2 libegl1 libgles2 libwayland-egl1 libxkbcommon-x11-0 libsecret-tools xdg-utils libvulkan1
            else
              dnf install -y shadow-utils util-linux ca-certificates curl python3 mpv-libs libglvnd-egl libglvnd-gles libwayland-client libwayland-egl libxkbcommon-x11 libsecret xdg-utils vulkan-loader
            fi
            if sh /dist/install.sh --check-deps; then echo "Root must be refused"; exit 1; fi
            useradd -m music
            su -s /bin/sh music -c "sh /dist/install.sh --archive /dist/yt-music-gpui-*.tar.gz"
            su -s /bin/sh music -c "sh /dist/install.sh --check-deps"
            ldd /home/music/.local/bin/yt-music-gpui
            su -s /bin/sh music -c "/home/music/.local/bin/yt-music-gpui --version"
            su -s /bin/sh music -c "sh /dist/install.sh --uninstall"
          '


  packages:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu:24.04, debian:13, fedora:43, opensuse/tumbleweed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-x86_64
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: player-test
          path: player-test
      - name: Install, check and remove the package in a clean container
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          YTDLP_VERSION=$(tar -xzOf dist/yt-music-gpui-*-x86_64-linux.tar.gz runtime-pins.json | jq -r .ytdlp_version)
          chmod 755 player-test/yt-music-gpui-tests
          docker run --rm -e "YTDLP_VERSION=$YTDLP_VERSION" -v "$PWD/dist:/dist:ro" \
            -v "$PWD/player-test:/player-test:ro" \
            -v "$PWD/packaging/test-package.sh:/test-package.sh:ro" "$DISTRO" sh /test-package.sh
