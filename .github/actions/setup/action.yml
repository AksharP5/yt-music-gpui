name: Set up build
description: Install the system libraries and Rust toolchain the app builds against.
inputs:
  cache:
    description: Restore and save the shared Rust build cache.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install system libraries
      if: runner.os == 'Linux'
      shell: bash
      # build.rs links EGL, GLESv2, X11, Xext, Wayland and libmpv; GPUI needs xcb, xkbcommon,
      # fontconfig and freetype.
      run: |
        # Prefer the faster Ubuntu mirror on hosted runners that default to EC2.
        mirrors=/etc/apt/apt-mirrors.txt
        if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && -f "$mirrors" ]]; then
          sudo sed -E -i \
            's#^(http://us-east-2\.ec2\.archive\.ubuntu\.com/ubuntu/)[[:blank:]]+priority:1$#http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n\1\tpriority:4#' "$mirrors"
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libegl-dev libgles-dev libwayland-dev libx11-dev libxext-dev libxcb1-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libmpv-dev
    - name: Install libmpv
      if: runner.os == 'macOS'
      shell: bash
      run: brew install mpv
    # mpv's own LGPL build, pinned by checksum. The app loads libmpv-2.dll at run time.
    - name: Install libmpv
      if: runner.os == 'Windows'
      shell: bash
      env:
        VERSION: v0.42.0
        SHA256: 8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce
      run: |
        cd "$RUNNER_TEMP"
        archive="libmpv-$VERSION-x86_64-w64-mingw32-lgpl.zip"
        curl -fsSLO "https://github.com/mpv-player/mpv/releases/download/$VERSION/$archive"
        echo "$SHA256  $archive" | sha256sum -c -
        7z x -olibmpv "$archive" libmpv-2.dll
        cygpath -w "$PWD/libmpv" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      if: ${{ inputs.cache == 'true' }}
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
