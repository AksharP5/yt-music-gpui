name: Set up build
description: Install the system libraries and Rust toolchain the app builds against. macOS builds libmpv with ./.github/actions/libmpv-macos.
inputs:
  cache:
    description: Restore and save the shared Rust build cache.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install system libraries
      if: runner.os == 'Linux'
      shell: bash
      # build.rs links EGL, GLESv2, X11, Xext, Wayland and libmpv; GPUI needs xcb, xkbcommon,
      # fontconfig and freetype.
      run: |
        packages=(
          pkg-config libegl-dev libgles-dev libwayland-dev libx11-dev libxext-dev libxcb1-dev
          libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libmpv-dev
        )
        apt_network=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1)
        fetch_packages() {
          sudo timeout --kill-after=15s 3m apt-get "${apt_network[@]}" update --error-on=any &&
            sudo timeout --kill-after=15s 6m apt-get "${apt_network[@]}" install -y \
              --no-install-recommends --download-only "${packages[@]}"
        }

        mirrors=/etc/apt/apt-mirrors.txt
        if ! fetch_packages; then
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && -f "$mirrors" ]] || exit 1
          printf '%s\n' 'APT fetch failed. Retrying at archive.ubuntu.com.'
          original=$(mktemp "$RUNNER_TEMP/apt-mirrors.XXXXXX")
          cp -- "$mirrors" "$original"
          trap 'sudo tee "$mirrors" < "$original" > /dev/null; rm -- "$original"' EXIT
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee "$mirrors" > /dev/null
          fetch_packages
        fi
        sudo apt-get install -y --no-install-recommends --no-download "${packages[@]}"
    # mpv's own LGPL build, pinned by checksum. The app loads libmpv-2.dll at run time.
    - name: Install libmpv
      if: runner.os == 'Windows'
      shell: bash
      env:
        VERSION: v0.42.0
        SHA256: 8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce
      run: |
        cd "$RUNNER_TEMP"
        archive="libmpv-$VERSION-x86_64-w64-mingw32-lgpl.zip"
        curl -fsSLO "https://github.com/mpv-player/mpv/releases/download/$VERSION/$archive"
        echo "$SHA256  $archive" | sha256sum -c -
        7z x -olibmpv "$archive" libmpv-2.dll
        cygpath -w "$PWD/libmpv" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      if: ${{ inputs.cache == 'true' }}
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
