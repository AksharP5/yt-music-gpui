[package]
name = "yt-music-gpui"
version = "0.2.14"
edition = "2024"
description = "A native YouTube Music player for Linux, built with GPUI."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
async-channel = "2"
getrandom = "0.4"
libc = "0.2"
raw-window-handle = "0.6"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
unicode-segmentation = "1"
sha1 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ErrorReporting",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
debug = 0

[lints.clippy]
expect_used = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
