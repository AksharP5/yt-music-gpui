[package]
name = "yt-music-gpui"
version = "0.2.31"
edition = "2024"
description = "A native YouTube Music player for Linux, built with GPUI."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
async-channel = "2"
getrandom = "0.4"
libc = "0.2"
raw-window-handle = { version = "0.6", features = ["std"] }
gpui = { package = "gpui-pre", version = "=0.3.9" }
# Without font-kit, macOS lays text out but draws no glyphs.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
unicode-segmentation = "1"
sha1 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSImage", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSString", "NSURL", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }
core-foundation = "0.10"
security-framework = { version = "3", default-features = false }
security-framework-sys = { version = "2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ErrorReporting",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
debug = 0

[lints.rust]
# bin/check-performance builds with `--cfg ytm_perf` for startup timestamps.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ytm_perf)"] }

[lints.clippy]
expect_used = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
