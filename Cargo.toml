[package]
name = "yt-music-gpui"
version = "0.1.0"
edition = "2024"
description = "A native YouTube Music player for Linux, built with GPUI."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
async-channel = "2"
libc = "0.2"
raw-window-handle = "0.6"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
toml = "0.9"
tempfile = "3"
unicode-segmentation = "1"
sha1 = "0.10"
zbus = "=5.19.0"

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
debug = 0
